<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe Fidelo - Imprensa Autorizada</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --gradiente: linear-gradient(135deg, #00c6ff, #0072ff);
      --roxo: #6a11cb;
      --rosa: #2575fc;
      --bg-glass: rgba(255, 255, 255, 0.15);
      --borda-glass: rgba(255, 255, 255, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      background: linear-gradient(-45deg, #6a11cb, #2575fc, #00c6ff, #0072ff);
      background-size: 400% 400%;
      animation: gradientLoop 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 30px;
    }

    @keyframes gradientLoop {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--bg-glass);
      border: 1px solid var(--borda-glass);
      border-radius: 20px;
      padding: 30px;
      width: 360px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1.5s ease forwards;
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .perfil {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .badge {
      margin-top: 15px;
      display: inline-block;
      background: var(--gradiente);
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.95rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .logo {
      margin-top: 20px;
      width: 180px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    }

    .cta-button {
      margin-top: 25px;
      display: inline-block;
      background: white;
      color: #0072ff;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    .cta-button:hover {
      background: #0072ff;
      color: white;
    }

    .about-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 30px;
      padding: 20px;
      border-radius: 16px;
      max-width: 400px;
      color: #fff;
      text-align: center;
      backdrop-filter: blur(15px);
      transition: 0.3s ease;
    }

    .about-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .about-card a {
      display: inline-block;
      margin-top: 10px;
      color: #00f2fe;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }

    .about-card a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card" data-aos="zoom-in">
    <img src="./perfil.jpeg" alt="Felipe Fidelo" class="perfil">
    <h1>Felipe Fidelo</h1>
    <p>Fotógrafo, Cinegrafista</p>
    <div class="badge">🎥 Imprensa Autorizada</div>
    <img src="./logo.png" alt="TV Rio Grande & RedeTV+" class="logo">
    <a href="/store.html" class="cta-button">Você foi fotografado?</a>
  </div>

  <div class="about-card" data-aos="fade-up" data-aos-delay="300">
    <h3>Felipe Fidelo</h3>
    <p>Designer, programador e fotógrafo. Atuando com criatividade e tecnologia. Saiba mais em meu portfólio.</p>
    <a href="https://felipefidelo.site" target="_blank">➡️ Visitar felipefidelo.site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
